# Publishes the GitHub Pages site: live at /shower-thoughts/ and staging at
# /shower-thoughts/staging/ (scripts/build-site.sh builds both, tests first).
#
# When it runs:
# - Push to main (a promote merged): live becomes main.
# - "Test staging" passed on a staging push: staging updates, live stays as it is.
# - Run workflow by hand with a tag (Actions > Test and deploy > Run workflow):
#   deploys that version tag to live. This is the roll back. Nothing on main changes.
#
# What's live is remembered by the "live" git tag, so a staging deploy never
# undoes a roll back. Only this workflow moves that tag.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Test staging]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Deploy a tag to live (roll back), for example v0.1.0. Leave empty to just redeploy.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick what goes live
        id: live
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          git fetch --tags --force origin
          if [ "${{ github.event_name }}" = push ]; then
            REF="${{ github.sha }}"; MOVE=1
          elif [ -n "$TAG" ]; then
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::There's no tag called $TAG"; exit 1; }
            REF="refs/tags/$TAG"; MOVE=1
          elif git rev-parse -q --verify refs/tags/live >/dev/null; then
            REF="refs/tags/live"; MOVE=0
          else
            REF="origin/main"; MOVE=1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "move=$MOVE" >> "$GITHUB_OUTPUT"
          echo "Live will be $REF ($(git rev-parse --short "$REF^{commit}"))"
      - name: Build and test live and staging
        run: bash scripts/build-site.sh "${{ steps.live.outputs.ref }}" "${{ github.event.repository.name }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
    outputs:
      ref: ${{ steps.live.outputs.ref }}
      move: ${{ steps.live.outputs.move }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        if: needs.build.outputs.move == '1'
        with:
          fetch-depth: 0
      - name: Tag the version and remember what's live (the "live" tag)
        if: needs.build.outputs.move == '1'
        run: |
          git fetch --tags --force origin
          # On a promote, make sure the version that was live before and the new one
          # both have a version tag (from package.json), so there's always one to roll back to.
          tagver() {
            v="v$(git show "$1:package.json" | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
            if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then echo "$v is already tagged"
            else git tag "$v" "$1" && git push origin "refs/tags/$v" && echo "Tagged $(git rev-parse --short "$1") as $v"; fi
          }
          if [ "${{ github.event_name }}" = push ]; then
            BEFORE="${{ github.event.before }}"
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then tagver "$BEFORE"; fi
            tagver "${{ github.sha }}"
          fi
          git tag -f live "${{ needs.build.outputs.ref }}^{commit}"
          git push -f origin refs/tags/live
